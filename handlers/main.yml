---
- name: Reload sshd
  ansible.builtin.service:
    name: "{{ openssh_service_name }}"
    state: reloaded
  become: true
  when:
    - openssh_service_enabled | default(true)
    - ansible_os_family != "Windows"

# Dynamic include so ansible.windows isn't required on non-Windows hosts
- name: Reload sshd
  ansible.builtin.include_tasks: noauto_reload_sshd_Windows.yml
  when:
    - openssh_service_enabled | default(true)
    - ansible_os_family == "Windows"
